<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="portalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="60%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#0f0026" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- 背景球体 -->
  <circle cx="50%" cy="50%" r="47" fill="#03001e" stroke="#7209b7" stroke-width="2" />
  
  <!-- ゲートの渦 (Portal) -->
  <circle cx="50%" cy="50%" r="35" fill="none" stroke="url(#portalGrad)" stroke-width="4.5" filter="url(#glow)" stroke-dasharray="10 6 4 6" />
  <circle cx="50%" cy="50%" r="22" fill="none" stroke="#4cc9f0" stroke-width="2" filter="url(#glow)" stroke-dasharray="2 3" />
  
  <!-- ネットワーク連結ノード (各ミニゲームが繋がっているポータルハブの象徴) -->
  <!-- 上: 火星 (赤) -->
  <circle cx="50%" cy="15" r="5" fill="#ff4d5a" filter="url(#glow)" />
  <line x1="50" y1="15" x2="50" y2="28" stroke="rgba(255, 77, 90, 0.4)" stroke-width="1.5" />
  
  <!-- 左下: オセロ/深海 (緑/青) -->
  <circle cx="20" cy="68" r="5" fill="#39e600" filter="url(#glow)" />
  <line x1="20" y1="68" x2="33" y2="60" stroke="rgba(57, 230, 0, 0.4)" stroke-width="1.5" />
  
  <!-- 右下: コピー/パスワード (ゴールド) -->
  <circle cx="80" cy="68" r="5" fill="#ffb703" filter="url(#glow)" />
  <line x1="80" y1="68" x2="67" y2="60" stroke="rgba(255, 183, 3, 0.4)" stroke-width="1.5" />
  
  <!-- コア -->
  <circle cx="50" cy="50" r="8" fill="#ffffff" filter="url(#glow)" />
</svg>
