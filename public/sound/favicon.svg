<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="sonarGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7209b7" />
      <stop offset="50%" stop-color="#3f37c9" />
      <stop offset="100%" stop-color="#03001e" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- 外枠 -->
  <circle cx="50%" cy="50%" r="47" fill="url(#sonarGrad)" stroke="#4cc9f0" stroke-width="2" />
  
  <!-- 同心円状のソナーリング (音波) -->
  <circle cx="50%" cy="50%" r="35" fill="none" stroke="#4cc9f0" stroke-width="1" stroke-dasharray="4 6" opacity="0.5" />
  <circle cx="50%" cy="50%" r="24" fill="none" stroke="#4cc9f0" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.8" />
  
  <!-- 中央の音波波形 (Equalizer) -->
  <path d="M 28 50 L 34 50 L 38 35 L 42 65 L 46 45 L 50 55 L 54 25 L 58 75 L 62 48 L 66 52 L 72 50" fill="none" stroke="#4cc9f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- ソナーの走査スイープ線 -->
  <line x1="50" y1="50" x2="78" y2="28" stroke="#39e600" stroke-width="2" stroke-linecap="round" opacity="0.85" filter="url(#glow)" />
</svg>
