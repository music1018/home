<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- ハッカーグリーンのグロー効果 -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ダークターミナル背景 -->
  <rect x="4" y="4" width="92" height="92" rx="14" fill="#030805" stroke="#39e600" stroke-width="2" />
  
  <!-- グリッドライン（薄いマトリックス風背景） -->
  <path d="M 15 4 L 15 96 M 30 4 L 30 96 M 45 4 L 45 96 M 60 4 L 60 96 M 75 4 L 75 96 M 90 4 L 90 96" fill="none" stroke="rgba(57, 230, 0, 0.05)" stroke-width="1" />
  
  <!-- プロンプト記号 `>` -->
  <path d="M 22 28 L 44 48 L 22 68" fill="none" stroke="#39e600" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- カーソル記号 `_` -->
  <line x1="50" y1="68" x2="78" y2="68" stroke="#39e600" stroke-width="8.5" stroke-linecap="round" filter="url(#glow)" />
</svg>
