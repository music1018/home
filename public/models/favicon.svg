<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1e0a3c"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- neural net nodes -->
  <circle cx="8" cy="10" r="2" fill="#a78bfa" filter="url(#glow)"/>
  <circle cx="8" cy="22" r="2" fill="#a78bfa" filter="url(#glow)"/>
  <circle cx="16" cy="7" r="2" fill="#c4b5fd" filter="url(#glow)"/>
  <circle cx="16" cy="16" r="2.5" fill="#e9d5ff" filter="url(#glow)"/>
  <circle cx="16" cy="25" r="2" fill="#c4b5fd" filter="url(#glow)"/>
  <circle cx="24" cy="10" r="2" fill="#a78bfa" filter="url(#glow)"/>
  <circle cx="24" cy="22" r="2" fill="#a78bfa" filter="url(#glow)"/>
  <!-- connections -->
  <line x1="8" y1="10" x2="16" y2="7"  stroke="#7c3aed" stroke-width="0.8" opacity="0.8"/>
  <line x1="8" y1="10" x2="16" y2="16" stroke="#7c3aed" stroke-width="0.8" opacity="0.8"/>
  <line x1="8" y1="22" x2="16" y2="16" stroke="#7c3aed" stroke-width="0.8" opacity="0.8"/>
  <line x1="8" y1="22" x2="16" y2="25" stroke="#7c3aed" stroke-width="0.8" opacity="0.8"/>
  <line x1="16" y1="7"  x2="24" y2="10" stroke="#7c3aed" stroke-width="0.8" opacity="0.8"/>
  <line x1="16" y1="16" x2="24" y2="10" stroke="#7c3aed" stroke-width="0.8" opacity="0.8"/>
  <line x1="16" y1="16" x2="24" y2="22" stroke="#7c3aed" stroke-width="0.8" opacity="0.8"/>
  <line x1="16" y1="25" x2="24" y2="22" stroke="#7c3aed" stroke-width="0.8" opacity="0.8"/>
</svg>
